name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages: write the Pages site, mint an OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; always let the newest commit win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # ~58 MB of clang + lld + sysroot. Kept out of git, fetched here so the
      # deployed site serves the toolchain from its own origin.
      - name: Fetch WebAssembly toolchain
        run: npm run toolchain

      # Proves "Run compiles real C/C++" end to end on every push.
      - name: Compiler smoke test
        run: npm run smoke:clang

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enables Pages with the "GitHub Actions" build type when it is not set
          # up yet, so the first deploy does not fail on a fresh repository.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
